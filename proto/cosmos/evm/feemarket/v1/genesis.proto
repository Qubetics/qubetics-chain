syntax = "proto3";
package cosmos.evm.feemarket.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/evm/feemarket/v1/feemarket.proto";

option go_package = "github.com/qubetics/qubetics-blockchain/v2/x/feemarket/types";

// GenesisState defines the feemarket module's genesis state.
message GenesisState {
  // params defines all the parameters of the feemarket module.
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // DEPRECATED: base fee is the exported value from previous software version.
  // Zero by default.
  reserved 2;
  reserved "base_fee";
  // block_gas is the amount of gas wanted on the last block before the upgrade.
  // Zero by default.
  uint64 block_gas = 3;
}
